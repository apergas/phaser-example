name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'webApp/**'
      - 'asset-packs/**'
      - 'kotlin-js-store/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Shared Kotlin core: the tests that matter for the web, then the npm package the web depends on.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:testAndroidHostTest :shared:jsBrowserTest :shared:jsBrowserProductionLibraryDistribution

      # 2. Web app: same steps as before the migration.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - run: npm ci
        working-directory: webApp
      - run: npm run typecheck
        working-directory: webApp
      - run: npm test
        working-directory: webApp
      - run: npm run build
        working-directory: webApp

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
