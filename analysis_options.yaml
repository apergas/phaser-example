include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/di.config.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    todo: ignore
    fixme: ignore

linter:
  rules:
    - prefer_relative_imports

formatter:
  trailing_commas: preserve
  page_width: 120
