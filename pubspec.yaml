name: rpg
description: "Top-down forest RPG: chop trees, gather wood and build a house."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  bloc: ^9.2.1
  collection: ^1.19.1
  easy_localization: ^3.0.8
  flame: ^1.38.2
  flame_bloc: ^1.12.24
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  hybrid_logger: ^1.1.0
  injectable: ^3.0.0
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  mockito: ^5.8.1
  bloc_test: ^10.0.0
  flame_test: ^2.3.1

flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/i18n/translations/
    - lib/core/assets/images/lpc/
    - lib/core/assets/images/icons/
